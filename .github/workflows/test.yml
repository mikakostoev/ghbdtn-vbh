# Builds the app and runs the self-test and the evaluation on a clean macOS. A runner has only one layout
# enabled, so `--eval` is told which installed ones to use; locally `./test.sh` takes the enabled ones.
# Both need the system Russian and English spellers (macOS ships them) and the Russian keyboard layout installed,
# which is what `keyboardLayouts(installed: true)` asks for — not enabled, only installed.
name: test

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # The self-test runs from a debug build: a failed precondition then names its line, which release strips.
      - run: swift build && .build/debug/ghbdtnvbh --selftest
      - run: swift build -c release
      # Everyday texts: not one false switch is allowed. The rare-word run is for the log only.
      - run: .build/release/ghbdtnvbh --eval --layouts US,Russian Tests/chat-ru.txt Tests/chat-en.txt
      - run: .build/release/ghbdtnvbh --eval --layouts US,Russian Tests/stress-ru.txt Tests/stress-en.txt || true
      # Languages without a system speller: the tables alone. Common words and English must stay put; rare words are for the log.
      - run: |
          for pair in fi:Finnish is:Icelandic nb:Norwegian pl:Polish lt:Lithuanian he:Hebrew hr:Croatian sk:Slovak et:Estonian mk:Macedonian sq:Albanian sr:Serbian-Latin fa:Persian ka:Georgian-QWERTY; do
            .build/release/ghbdtnvbh --eval --layouts "US,${pair#*:}" "Tests/common-${pair%%:*}.txt" Tests/chat-en.txt
            .build/release/ghbdtnvbh --eval --layouts "US,${pair#*:}" "Tests/stress-${pair%%:*}.txt" || true
          done
